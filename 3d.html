window.levenshtein = window.levenshtein || function(a,b){ const m=a.length,n=b.length; const dp=Array.from({length:m+1},()=>Array(n+1).fill(0)); for(let i=0;i<=m;i++) dp[i][0]=i; for(let j=0;j<=n;j++) dp[0][j]=j; for(let i=1;i<=m;i++) for(let j=1;j<=n;j++){ const cost=a[i-1]===b[j-1]?0:1; dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+cost); } return dp[m][n]; };
window.log = function(msg){ if(localStorage.getItem("debug")==="1") console.log("[log] "+msg); };
window.addEventListener("error", e=>{

let touchStartX=0;
function renderBook(){
  window.log(`📖 Книга стр ${bookPage+1}/${Math.max(1,Math.ceil(getAchList().filter(a=>a.done).length/bookPerPage))}`);
  const pages=document.getElementById("bookPages");
  const prog=document.getElementById("bookProgress");
  const info=document.getElementById("bookPageInfo");
  const prev=document.getElementById("bookPrev");
  const next=document.getElementById("bookNext");
  if(!pages) return;
  const total=48;
  const done=(achievements.spin?1:0)+(achievements.salto?1:0)+(achievements.hit?1:0)+(achievements.invis?1:0)+(achievements.crouch?1:0)+(achievements.jump?1:0)+(achievements.creeper?1:0)+(achievements.fall?1:0)+(achievements.block?1:0)+(achievements.dance?1:0)+(achievements.crash?1:0)+(achievements.run?1:0)+(achievements.fly?1:0)+(achievements.shake?1:0)+(achievements.zombie?1:0)+(achievements.giant?1:0)+(achievements.tiny?1:0)+(achievements.rainbow?1:0)+(achievements.ghost?1:0)+(achievements.wave?1:0)+(achievements.storm?1:0)+(achievements.teleport?1:0)+(achievements.clone?1:0)+(achievements.fire?1:0)+(achievements.water?1:0)+(achievements.ice?1:0)+(achievements.lightning?1:0)+(achievements.explosion?1:0)+(achievements.void?1:0)+(achievements.parkour?1:0)+(achievements.disco?1:0)+(achievements.robot?1:0)+(achievements.ninja?1:0)+(achievements.space?1:0)+(achievements.gravity?1:0)+(achievements.magnet?1:0)+(achievements.summon?1:0)+(achievements.time?1:0)+(achievements.shield?1:0)+(achievements.bow?1:0)+(achievements.elytra?1:0)+(achievements.totem?1:0)+(achievements.dragon?1:0)+(achievements.portal?1:0)+(achievements.chameleon?1:0)+(achievements.wind?1:0)+(achievements.lava?1:0)+(achievements.snow?1:0);
  const all=getAchList().filter(a=>a.done);
  const totalPages=Math.max(1, Math.ceil(all.length / bookPerPage));
  if(bookPage>=totalPages) bookPage=totalPages-1;
  if(bookPage<0) bookPage=0;
  const slice=all.slice(bookPage*bookPerPage, (bookPage+1)*bookPerPage);
  let html=`<div class="book-page">`;
  if(!slice.length){
    html+=`<div class="book-entry locked"><span class="icon mc-icon">?</span><span>Пока пусто<br><small style="font-size:11px;color:#5C2E0C">выполни команду — и ачивка появится здесь</small></span></div>`;
  }
  slice.forEach(a=>{
    const state="done";
    const isDataIcon = a.icon && a.icon.startsWith("data:");
    const iconHtml = `<span class="icon mc-icon" style="background-image:url('${encodeHTML(a.icon)}')"></span>`;
    html+=`<div class="book-entry ${state}">${iconHtml}<span>${a.title}<br><small style="font-size:10px;color:#6B6B6B">${a.desc}</small><br><small style="font-size:11px;color:#2d5a00">выполнено: ${a.cnt} раз</small></span></div>`;
  });
  html+=`</div>`;
  pages.innerHTML=html;
  if(info) info.innerHTML=`<b>${bookPage+1}</b> <i>⁄</i> <b>${totalPages}</b>`;
  if(prev) prev.disabled=bookPage===0;
  if(next) next.disabled=bookPage===totalPages-1;
  if(prog){
    prog.textContent = `${done}/${total} ачивок собрано` + (done===total && total>0 ? _u("erjaznqKyIr7is96ivuKxIrLivqKyorHivF7eqrF1NM=") : "");
    if(done===total && total>0){
      prog.classList.add("all-done");
      prog.style.color="#0f3a00";
      prog.style.textShadow="1px 1px 0 rgba(255,255,255,0.9), 0 1px 4px rgba(0,0,0,0.25)";
    } else {
      prog.classList.remove("all-done");
      prog.style.color="#3B2F0F";
      prog.style.textShadow="1px 1px 0 #FFF";
    }
  }
  try{ updateProgressBar(done,total); }catch(e){}
}
function openBook(){
  const m=document.getElementById("bookModal");
  const o=document.getElementById("bookOverlay");
  if(m){ m.classList.remove("closing"); m.classList.add("open"); }
  if(o) o.classList.add("open");
  renderBook();
}
function closeBook(){
  const m=document.getElementById("bookModal");
  const o=document.getElementById("bookOverlay");
  if(m && m.classList.contains("open")){
    m.classList.add("closing");
    setTimeout(()=>{ m.classList.remove("open","closing"); if(o) o.classList.remove("open"); }, 220);
  } else {
    if(m) m.classList.remove("open");
    if(o) o.classList.remove("open");
  }
}
// progress bar helper
function updateProgressBar(done, total){
  const bar=document.getElementById("progressBar");
  if(!bar) return;
  bar.style.width=Math.round(done/total*100)+"%";
}
function handlePageFlip(dir){

  let startTime=0;
  try{ startTime=parseInt(localStorage.getItem("ach_startTime")||"0",10); }catch(e){}
  let elapsed="";
  if(startTime){
    const diff=Date.now()-startTime;
    const h=Math.floor(diff/3600000);
    const m=Math.floor((diff%3600000)/60000);
    const s=Math.floor((diff%60000)/1000);
    if(h>0) elapsed=`${h}ч ${m}м`;
    else if(m>0) elapsed=`${m}м ${s}с`;
    else elapsed=`${s}с`;
  }
  const now=new Date();
  const timeStr=now.toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
  return {done, total:48, timeStr, elapsed, startTime};
}
function getSharePayload(){
  try{
    const doneKeys=Object.keys(achievements).filter(k=> !k.endsWith("Count") && achievements[k]===true);
    const st=getShareStats();
    return {v:1, keys:doneKeys, done:st.done, total:st.total, time:Date.now(), timeStr:st.timeStr, elapsed:st.elapsed};
  }catch(e){ return {v:1, keys:[], done:0, total:48, time:Date.now(), timeStr:new Date().toLocaleString("ru-RU")}; }
}
function getShareText(){
  const st=getShareStats();
  const list=getAchList().filter(a=>a.done);
  let lines=[];
  lines.push("🏆 Steve 3D — Мой результат");
  lines.push(`📅 ${st.timeStr}${st.elapsed ? ` • ⏱ ${st.elapsed} в игре` : ""}`);
  lines.push(`📖 ${st.done}/${st.total} ачивок — ${Math.round(st.done/st.total*100)}%`);
  lines.push("");
  if(!list.length) lines.push("Пока пусто — выполни команду и ачивка появится здесь");
  else list.forEach(a=> lines.push(`✅ ${a.title} — ${a.cnt} раз • ${a.desc}`));
  lines.push("");
  lines.push("👉 Открой ссылку чтобы увидеть книгу:");
  lines.push(getShareUrl());
  return lines.join("\n");
}
function getShareUrl(){
  try{
    const payload=getSharePayload();
    const data=btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(payload))));
    const base=location.origin+location.pathname;
    return base+"?share="+encodeURIComponent(data);
  }catch(e){ return location.href; }
}
function decodeSharePayload(s){
  try{
    const j=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(decodeURIComponent(s)), c=>c.charCodeAt(0))));
    if(j && typeof j==="object" && Array.isArray(j.keys)) return j;
    if(Array.isArray(j)) return {v:1, keys:j, done:j.length, total:48, time:Date.now(), timeStr:new Date().toLocaleString("ru-RU")};
  }catch(e){}
  try{
    const j2=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(s), c=>c.charCodeAt(0))));
    if(Array.isArray(j2)) return {v:1, keys:j2, done:j2.length, total:48, time:Date.now(), timeStr:new Date().toLocaleString("ru-RU")};
  }catch(e){}
  return null;
}

      if(dx<0){ const tp=Math.max(1,Math.ceil(getAchList().filter(a=>a.done).length/bookPerPage)); if(bookPage<tp-1){bookPage++; renderBook();} }
      else { if(bookPage>0){bookPage--; renderBook();} }
    }
  }, {passive:true});
}
document.getElementById("bookClose").addEventListener("click", closeBook);
document.getElementById("bookOverlay").addEventListener("click", closeBook);
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeBook(); });
btn.addEventListener("click", handleCmd);
input.addEventListener("keydown", e=>{
  if(e.key==="Enter" || e.keyCode===13) handleCmd();
  if(e.key==="Escape") input.blur();
});
setTimeout(()=> input.focus(), 300);
window.handleCmd = handleCmd;
console.log("✅ Steve 3D loaded, handleCmd ready", {input:!!input, btn:!!btn, bar:!!bar});
if(!input || !btn) console.error("❌ input/btn not found", input, btn);
window.addEventListener("error", e=>{ console.error("JS error", e.message); if(window.showToast) window.showToast(e.message, true); });
if(new URLSearchParams(location.search).get("reset")==="1"){ setTimeout(()=> doReset(), 400); }
let resizeTimer=null;
function onResize(){
  const w=window.innerWidth, h=window.innerHeight;
  camera.aspect=w/h; camera.updateProjectionMatrix();
  renderer.setSize(w,h);
  renderer.setPixelRatio(Math.min(devicePixelRatio, w<640 ? 1.5 : 2));
}
function debouncedResize(){ clearTimeout(resizeTimer); resizeTimer=setTimeout(onResize,80); }
addEventListener("resize", debouncedResize);
addEventListener("orientationchange", ()=> setTimeout(onResize, 200));
if(window.visualViewport) visualViewport.addEventListener("resize", debouncedResize);
onResize();
// fallback for file://
if(location.protocol==="file:"){
  console.warn("file:// detected, use http://localhost:8000/3d.html for full 3D");
  showToast(_u("isSL2Irgi9qK5Irjeovdiu+L2orviu16i9uK74vaiuiK74vaYHoqIy4yNTR6dzd6Mi4uKnQpPygsPyh6Ympqag=="), true);
}
</script>
<script>
// Fallback for Enter/Button if module failed
document.addEventListener("DOMContentLoaded", ()=>{
  setTimeout(()=>{
    const ib=document.getElementById("cmd");
    const bb=document.getElementById("cmdBtn");
    if(bb && !bb._hasFallback){
      bb._hasFallback=true;
      bb.addEventListener("click", ()=>{
        if(window.handleCmd) window.handleCmd();
        else {
          const v=ib?ib.value.trim():"";
          alert("Module failed to load (use http://localhost:8000/3d.html)\nEntered: "+v);
        }
      });
    }
    if(ib && !ib._hasFallback){
      ib._hasFallback=true;
      ib.addEventListener("keydown", (e)=>{
        if(e.key==="Enter" || e.keyCode===13){
          if(window.handleCmd) window.handleCmd();
        }
      });
    }
  }, 500);
});

</script>
